[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seculens"
version = "1.0.0"
description = "Professional Python-based CLI security assessment platform"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0"
]

[project.scripts]
seculens = "app.cli:app"

[tool.setuptools]
packages = ["app", "app.core", "app.scanners", "app.scanners.web"]